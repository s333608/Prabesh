<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe8f0 50%, #fff0f5 100%);
            overflow: hidden;
            position: relative;
        }

        .flower {
            position: fixed;
            font-size: 3rem;
            opacity: 0.7;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5rem;
            color: #d63384;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .emoji-hearts {
            font-size: 2rem;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff4757 0%, #ee5a6f 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6);
        }

        .yes-btn:active {
            transform: scale(0.98);
        }

        .no-btn {
            background: linear-gradient(135deg, #a4a4a4 0%, #8b8b8b 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: fixed;
            pointer-events: none;
        }

        .flower-burst {
            position: fixed;
            font-size: 4rem;
            animation: burstAnimation 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes burstAnimation {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .balloon {
            position: fixed;
            font-size: 2rem;
            animation: rise 3s ease-in forwards;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                opacity: 1;
                transform: translateY(0) translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-500px) translateX(var(--tx));
            }
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            z-index: 999;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-hearts">❤️ 💕 ❤️</div>
        <h1>Will you be my Valentine?</h1>
        <div class="buttons">
            <button class="yes-btn" id="yesBtn">Yes 💕</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        noBtn.addEventListener('mouseenter', () => {
            const randomX = Math.random() * 300 - 150;
            const randomY = Math.random() * 300 - 150;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        });

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const randomX = Math.random() * 300 - 150;
            const randomY = Math.random() * 300 - 150;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        });

        yesBtn.addEventListener('click', () => {
            celebrate();
        });

        function celebrate() {
            createFlowers();
            createBalloons();
            createConfetti();
            showMessage();
        }

        function createFlowers() {
            const flowers = ['🌹', '🌺', '🌸', '🌷', '💐'];
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.className = 'flower-burst';
                    flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];

                    const angle = (i / 15) * Math.PI * 2;
                    const distance = 150;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    flower.style.setProperty('--tx', tx + 'px');
                    flower.style.setProperty('--ty', ty + 'px');
                    flower.style.left = '50%';
                    flower.style.top = '50%';
                    flower.style.transform = 'translate(-50%, -50%)';

                    document.body.appendChild(flower);

                    setTimeout(() => flower.remove(), 1000);
                }, i * 50);
            }
        }

        function createBalloons() {
            const balloons = ['🎈', '🎉'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.textContent = balloons[Math.floor(Math.random() * balloons.length)];
                    balloon.style.left = Math.random() * window.innerWidth + 'px';
                    balloon.style.bottom = '-50px';
                    balloon.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');

                    document.body.appendChild(balloon);

                    setTimeout(() => balloon.remove(), 3000);
                }, i * 100);
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.textContent = Math.random() > 0.5 ? '💕' : '😘';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = Math.random() * window.innerHeight + 'px';
                confetti.style.fontSize = Math.random() * 1.5 + 1 + 'rem';
                confetti.style.opacity = Math.random() * 0.7 + 0.3;
                confetti.style.animation = `fall ${Math.random() * 2 + 2}s ease-in forwards`;

                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function showMessage() {
            const messages = ['She said YES! 💕', 'I love you! 😘', 'Forever together! 💕'];
            const message = document.createElement('div');
            message.className = 'message';
            message.textContent = messages[Math.floor(Math.random() * messages.length)];
            document.body.appendChild(message);

            setTimeout(() => message.remove(), 3000);
        }

        window.addEventListener('load', () => {
            const flowers = ['🌹', '🌺', '🌸', '🌷'];
            for (let i = 0; i < 8; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + '%';
                flower.style.top = Math.random() * 100 + '%';
                flower.style.animationDelay = Math.random() * 2 + 's';
                flower.style.animationDuration = (Math.random() * 4 + 4) + 's';
                document.body.appendChild(flower);
            }
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
